object NotificationCommand "servicenow-service-notification" {
  command = [ "/usr/share/icingaweb2/bin/icingacli", "servicenow", "send", "notification" ]

  arguments += {
    "--host" = {
      description = "Name of the Icinga Host"
      required = true
      value = "$notification_hostname$"
    }
    "--service" = {
      description = "Name of the Icinga Service"
      required = true
      value = "$notification_servicename$"
    }
    "--output" = {
      description = "Output of the notification"
      required = true
      value = "$notification_serviceoutput$"
    }
    "--state" = {
      description = "State of the notification (OK, Warning, Critical, Up, Down)"
      required = true
      value = "$notification_servicestate$"
    }
    "--type" = {
      description = "Type of the notification (Problem, Recovery, FlappingStart, etc.)"
      required = true
      value = "$notification_type$"
    }
    "--name" = {
      description = "Name of the notification"
      required = true
      value = "$snow_name$"
    }
    "--template" = {
      description = "Template to use for field translation"
      value = "$snow_template$"
    }
    "--extra" = {
      description = "Additional fields to use for field translation. Can be used multiple times"
      value = "$snow_extra$"
    }
  }

  vars += {
    notification_type = "$notification.type$"
    notification_hostname = "$host.name$"
    notification_servicename = "$service.name$"
    notification_serviceoutput = "$service.output$"
    notification_servicestate = "$service.state$"
    notification_name= "$snow.name$"
    notification_template = "$snow.template$"
    notification_extra = "$snow.extra$"
  }
}

template Notification "snow-svc-notification" {
  command = "servicenow-service-notification"

  states = [ OK, Warning, Critical, Unknown ]
  types = [ Problem, Acknowledgement, Recovery, Custom,
            FlappingStart, FlappingEnd,
            DowntimeStart, DowntimeEnd, DowntimeRemoved ]
}

apply Notification "snow" to Service {
  import "snow-svc-notification"

  users = [ "snowadmin" ]

  assign where service.vars.notification_snow
}

apply Service "snow-users" {
  import "generic-service"

  check_command = "users"

  assign where host.name == NodeName

  # max_check_attempts = 1

  vars.notification_snow = true
  vars.snow_name = "generic"
  vars.snow_template = "mytemplate"
}

object User "snowadmin" {
  display_name = "ServiceNow Admin"
  enable_notifications = true
}
